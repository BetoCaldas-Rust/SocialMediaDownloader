[package]
name = "social-media-downloader"
version = "2.0.0"
edition = "2021"

[dependencies]
eframe = "0.28"
egui = "0.28"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
arboard = "3.4"
global-hotkey = "0.6"
rfd = "0.14"
async-trait = "0.1"
chrono = "0.4"
directories = "5.0"
tracing = "0.1"
tracing-subscriber = "0.3"

[[bin]]
name = "social-media-downloader"
path = "src/main.rs"

[package.metadata.packager]
product-name = "Social Media Downloader"
identifier = "com.betocaldas.smd"
version = "2.0.0"
authors = ["Beto Caldas"]
publisher = "Beto Caldas"
description = "Baixe vídeos de diversas redes sociais."
icons = ["icons/icon.png"]
out-dir = "dist"
resources = ["locales/", "resources/bin/"]

[[package.metadata.packager.binaries]]
path = "social-media-downloader.exe"
main = true
[build-dependencies]
winres = "0.1"
