[package]
name = "social-media-downloader"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.28"
egui = "0.28"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
arboard = "3.4"
global-hotkey = "0.6"
rfd = "0.14"

[[bin]]
name = "social-media-downloader"
path = "src/main.rs"
