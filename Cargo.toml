[package]
name = "social-media-downloader"
version = "1.0.14"
edition = "2021"

[dependencies]
eframe = "0.28"
egui = "0.28"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
arboard = "3.4"
global-hotkey = "0.6"
rfd = "0.14"

[[bin]]
name = "social-media-downloader"
path = "src/main.rs"

[package.metadata.packager]
product-name = "Social Media Downloader"
identifier = "com.betocaldas.smd"
version = "1.0.14"
authors = ["Beto Caldas"]
publisher = "Beto Caldas"
description = "Baixe vÃ­deos de diversas redes sociais."
icons = ["icons/icon.png"]
out-dir = "dist"
resources = ["backend/dist/smd-backend.exe"]

[[package.metadata.packager.binaries]]
path = "social-media-downloader.exe"
main = true
[build-dependencies]
winres = "0.1"
