version: '3.8'

services:
  backend:
    build: ./backend
    container_name: social-media-downloader-api
    ports:
      - "8000:8000"
    volumes:
      # Mapeia pasta de downloads para o host
      - ./downloads:/downloads
      # Mapeia pasta de config para persistência
      - ./backend/config.json:/app/config.json
    environment:
      - DOWNLOAD_PATH=/downloads
    restart: unless-stopped
